<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Handmade Hamlet</title>
<link rel="stylesheet" href="./colors_and_type.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  #cart-toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #fff;
    border: 2.5px solid var(--ink-900);
    border-radius: 18px;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 3px 0 rgba(18,18,18,0.9);
    z-index: 100;
    font-family: var(--font-body);
    transition: transform 320ms cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }
  #cart-toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--ink-100); }
  ::-webkit-scrollbar-thumb { background: var(--ink-400); border-radius: 4px; }

  ::selection { background: var(--mustard-200); color: var(--ink-900); }
</style>
</head>
<body>
<div id="root"></div>
<div id="cart-toast">
  <span style="font-family:var(--font-display); font-weight:700; font-size:18px;">✓</span>
  <span id="cart-toast-msg"></span>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./Atoms.jsx"></script>
<script type="text/babel" src="./ShopPage.jsx"></script>
<script type="text/babel" src="./BuilderPage.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [page, setPage] = useState('shop');
  const [cart, setCart] = useState([]);

  const addToCart = (name) => {
    setCart((c) => [...c, name]);
    const t = document.getElementById('cart-toast');
    document.getElementById('cart-toast-msg').textContent = `Added "${name}" to cart`;
    t.classList.add('show');
    clearTimeout(window._toastT);
    window._toastT = setTimeout(() => t.classList.remove('show'), 2400);
  };

  return (
    <div>
      <NavBar activePage={page} onNav={setPage} cartCount={cart.length} />
      {page === 'shop' && <ShopPage onNav={setPage} onAddToCart={addToCart} />}
      {page === 'build' && <BuilderPage onAddToCart={(n) => { addToCart(n); setPage('shop'); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
